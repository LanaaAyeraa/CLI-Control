  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg-main: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-inner: #F1F5F9;
      --border-color: #CBD5E1;
      --text-main: #0F172A;
      --text-muted: #475569;
    }
    body.theme-dark {
      --bg-main: #070D1E;
      --bg-card: #0E172F;
      --bg-inner: #090E1F;
      --border-color: #1E2C52;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .cli-card { background-color: var(--bg-card); border-color: var(--border-color); color: var(--text-main); }
    .cli-inner { background-color: var(--bg-inner); border-color: var(--border-color); color: var(--text-main); }
    .hero-gradient {
      background: linear-gradient(135deg, #0284C7 0%, #2563EB 55%, #7C3AED 100%);
    }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-track { background: var(--bg-inner); }
    .custom-scroll::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased custom-scroll">

  <!-- TOP HEADER BAR -->
  <header class="cli-card border-b sticky top-0 z-40 shadow-xs">
    <div class="max-w-[1600px] mx-auto px-4 lg:px-8 h-16 flex items-center justify-between gap-4">

          </div>
          <p class="text-[10px] text-slate-600 dark:text-slate-400 font-medium">Language Discipline & Permission Management • ZIIS Putri</p>
        </div>
      </div>

      <div class="flex-1 max-w-xl hidden md:flex items-center relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5"></i>
        <input 
          type="text" 
          id="global-search-header"
          oninput="handleGlobalHeaderSearch(this.value)"
          placeholder="Cari santriwati, anggota LCD, atau kelas..."

        />
        <span class="absolute right-3 text-[10px] cli-card border text-slate-400 px-1.5 py-0.5 rounded font-mono">Ctrl K</span>
        <div id="header-search-results" class="hidden absolute top-12 left-0 w-full cli-card rounded-2xl shadow-2xl border p-2 max-h-64 overflow-y-auto z-50"></div>
      </div>

    function unpackStudents(raw) {
      return raw.trim().split("\n").map(line => {
        const p = line.split("|");
        return {
          id: p[0],
          name: p[1],
          class: p[2],
          is_lcd: p[3] === "1"
        };
      });
    }

    const Storage = {
      get(key, fallback) {
        try {
          const item = localStorage.getItem('CLI_SAFE_FINAL_' + key);
          return item ? JSON.parse(item) : fallback;
        } catch { return fallback; }
      },
      set(key, val) {
        try {
          localStorage.setItem('CLI_SAFE_FINAL_' + key, JSON.stringify(val));
        } catch (e) { console.error("Storage Error", e); }
      }
    };

    function initTopBarOfficer() {
      const sel = document.getElementById('global-officer-select');
      if (!sel) return;
      sel.innerHTML = CLI_OFFICERS.map(name => `
        <option value="${name}" ${name === currentGlobalOfficer ? 'selected' : ''}>${name}</option>
      `).join('');

    function changeGlobalOfficer(name) {
      currentGlobalOfficer = name;
      Storage.set('ACTIVE_OFFICER', name);
      if (currentTab === 'dashboard') {
        renderDashboard(document.getElementById('app-container'));
      }
      safeCreateIcons();
    }

    function toggleThemeMode() {
      currentThemeMode = currentThemeMode === 'dark' ? 'light' : 'dark';
      Storage.set('THEME_MODE', currentThemeMode);
      applyTheme();
    }

    function applyTheme() {
      const icon = document.getElementById('theme-icon');
      if (currentThemeMode === 'dark') {
        document.body.classList.add('theme-dark');
        if (icon) icon.setAttribute('data-lucide', 'sun');
      } else {
        document.body.classList.remove('theme-dark');
        if (icon) icon.setAttribute('data-lucide', 'moon');
      }
      safeCreateIcons();
    }

    function safeCreateIcons() {
      try {
        if (window.lucide && typeof lucide.createIcons === 'function') {
          lucide.createIcons();
        }
      } catch (e) {}
    }

    let currentTab = 'dashboard';

    function navigate(tabId) {
      try {
        currentTab = tabId;
        document.querySelectorAll('.nav-pill').forEach(btn => {
          btn.classList.remove('text-sky-500', 'bg-sky-500/15', 'border-sky-500/30');
          btn.classList.add('text-slate-700', 'dark:text-slate-300');
        });
        const activeBtn = document.getElementById('nav-' + tabId);
        if (activeBtn) {
          activeBtn.classList.add('text-sky-500', 'bg-sky-500/15', 'border-sky-500/30');
          activeBtn.classList.remove('text-slate-700', 'dark:text-slate-300');
        }

        const container = document.getElementById('app-container');
        if (!container) return;

        if (tabId === 'dashboard') renderDashboard(container);
        else if (tabId === 'input-violation') renderInputViolation(container);
        else if (tabId === 'permissions') renderPermissions(container);
        else if (tabId === 'collaboration') renderCollaboration(container);
        else if (tabId === 'violations') renderDataViolations(container);
        else if (tabId === 'students') renderStudents(container);
        else if (tabId === 'reports') renderReports(container);
        else if (tabId === 'backup') renderBackup(container);
        else if (tabId === 'categories') renderCategories(container);

        safeCreateIcons();
      } catch (err) {
        console.error("Navigation error:", err);
      }
    }

    function calculateSopSanction(level, callCount) {
      if (level === 'RINGAN') {
        if (callCount <= 1) return "Panggilan 1: Menulis 20 mufrodat.";
        if (callCount === 2) return "Panggilan 2: Menulis 30 mufrodat, Menghafal 2 judul daily conversation.";
        return "Panggilan 3: Menulis 40 mufrodat, Menulis dan menghafal 3 judul daily conversation.";
      } else if (level === 'SEDANG') {
        if (callCount <= 1) return "Panggilan 1: Menulis 50 mufrodat, Menulis 2 judul daily conversation.";
        if (callCount === 2) return "Panggilan 2: Menulis 60 mufrodat, Menulis dan menghafal 3 judul daily conversation.";
        return "Panggilan 3: Menulis dan menghafal 20 uslub, Menulis dan menghafal 5 judul daily conversation.";
      } else {
        if (callCount <= 1) return "Panggilan 1: Menulis dan menghafal 50 mufrodat, Menggunakan papan 3 hari.";
        if (callCount === 2) return "Panggilan 2: Menulis dan menghafal 30 uslub, menghafal 3 judul daily conversation, Menggunakan papan 3 hari.";
        return "Panggilan 3: Menulis dan menghafal 40 uslub, Menghafal 3 judul daily conversation, Menggunakan papan 5 hari, Menggunakan kerudung pelanggaran bahasa.";
      }
    }

    function switchMusicSource(src) {
      activePlayerSource = src;
      const btnYt = document.getElementById('btn-src-yt');
      const btnSp = document.getElementById('btn-src-sp');
      const frame = document.getElementById('music-iframe');
      if (!frame) return;

      if (src === 'youtube') {
        if (btnYt) btnYt.className = 'py-1.5 rounded-lg bg-sky-500 text-white shadow-xs text-center transition';
        if (btnSp) btnSp.className = 'py-1.5 rounded-lg text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition text-center';
        frame.src = 'https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1';
      } else {
        if (btnSp) btnSp.className = 'py-1.5 rounded-lg bg-sky-500 text-white shadow-xs text-center transition';
        if (btnYt) btnYt.className = 'py-1.5 rounded-lg text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition text-center';
        frame.src = 'https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M?utm_source=generator&theme=0';
      }
    }

    function playPresetMusic(type) {
      const frame = document.getElementById('music-iframe');
      if (!frame) return;
      if (type === 'lofi') frame.src = 'https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1';
      else if (type === 'instrumental') frame.src = 'https://www.youtube.com/embed/lTRiuFIWV54?autoplay=1';
      else if (type === 'quran') frame.src = 'https://www.youtube.com/embed/1_Y96z-d1K0?autoplay=1';
      switchMusicSource('youtube');
    }

    function updateMusicTrack() {
      const input = document.getElementById('music-url-input')?.value.trim();
      const frame = document.getElementById('music-iframe');
      if (!input || !frame) return;

      if (input.includes('spotify.com')) {
        let embedUrl = input.includes('/embed/') ? input : input.replace('spotify.com/', 'spotify.com/embed/');
        frame.src = embedUrl;
        switchMusicSource('spotify');
      } else {
        const m = input.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
        if (m && m[1]) {

    async function handleSendDashboardAi(e) {
      e.preventDefault();
      const input = document.getElementById('ai-dashboard-input');
      const text = input?.value.trim();
      if (!text) return;

      const container = document.getElementById('ai-dashboard-messages');
      if (!container) return;

      container.innerHTML += `
        <div class="bg-sky-600 text-white p-2.5 rounded-2xl rounded-tr-xs max-w-[85%] ml-auto text-xs shadow-xs">
          ${text}
        </div>
      `;
      input.value = '';
      container.scrollTop = container.scrollHeight;

      const activeKey = DB.groqApiKey || DEFAULT_GROQ_KEY;
      if (!activeKey || !activeKey.startsWith("gsk_")) {
        container.innerHTML += `
          <div class="bg-rose-500/20 text-rose-500 p-2.5 rounded-2xl rounded-tl-xs border border-rose-500/30 text-xs font-semibold">
            Groq API Key belum valid. Klik ikon gerigi pengaturan di kanan atas kotak asisten ini untuk mengisi API Key ya Kak!
          </div>
        `;
        container.scrollTop = container.scrollHeight;
        return;
      }

      container.innerHTML += `<div id="ai-loading-dash" class="text-slate-600 dark:text-slate-400 italic text-[11px] font-medium">CLI Assistant Kece sedang mengetik... ⚡</div>`;
      container.scrollTop = container.scrollHeight;

      try {
        const systemPrompt = `Kamu adalah CLI Assistant Kece: Asisten AI Cerdas, Ramah, Sopan & Energik untuk Bagian Bahasa (CLI) Pondok Pesantren Modern ZIIS Putri Cilongok.
Petugas aktif saat ini: ${currentGlobalOfficer}.
Total data santriwati: ${DB.students.length}.
Program bahasa: Ilqo Mufrodat (harian Ahad-Jumat), Muhadatsah (Sabtu), Language Event (Ahad).
SOP Pelanggaran: Ringan (Aku-Kamu, Telat), Sedang (Bahasa Daerah Jawa/Sunda, Alpa 1-2x), Berat (Bahasa Kasar/Kotor, Alpa >=3x). Sanksi bertingkat mulai dari menulis mufrodat, daily conversation, uslub, papan bahasa, hingga kerudung pelanggaran.
Format perizinan dari Mba Fita: Tanggal, Nama, Kelas, Agenda Bahasa, dan Reason (Alasan). Jawablah dengan lugas, ramah, dan solutif.`;

        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${activeKey}`
          },
          body: JSON.stringify({
            model: 'llama-3.1-8b-instant',
            messages: [
              { role: 'system', content: systemPrompt },
              { role: 'user', content: text }
            ],
            temperature: 0.7,
            max_tokens: 600
          })
        });

        document.getElementById('ai-loading-dash')?.remove();
        if (res.ok) {
          const data = await res.json();
          const reply = data.choices[0].message.content;
          container.innerHTML += `
            <div class="cli-inner p-2.5 rounded-2xl rounded-tl-xs border text-xs whitespace-pre-line leading-relaxed text-slate-900 dark:text-white font-medium">
              ${reply}
            </div>
          `;
        } else {
          container.innerHTML += `
            <div class="bg-rose-500/20 text-rose-500 p-2.5 rounded-2xl rounded-tl-xs border border-rose-500/30 text-xs font-semibold">
              Gagal menghubungi Groq API. Pastikan API Key valid atau kuota mencukupi.
            </div>
          `;
        }
      } catch (err) {
        document.getElementById('ai-loading-dash')?.remove();
        container.innerHTML += `
          <div class="bg-rose-500/20 text-rose-500 p-2.5 rounded-2xl rounded-tl-xs border border-rose-500/30 text-xs font-semibold">
            Gangguan koneksi internet: ${err.message}
          </div>
        `;
      }
      container.scrollTop = container.scrollHeight;
    }

    function handleStudentSearch(q) {
      const resContainer = document.getElementById('student-search-results');
      if (!resContainer) return;
      if (!q || q.length < 2) {
        resContainer.classList.add('hidden');
        return;
      }
      const matches = (DB.students || []).filter(s => 
        s.name.toLowerCase().includes(q.toLowerCase()) || 
        s.id.toLowerCase().includes(q.toLowerCase())
      ).slice(0, 10);

      if (matches.length === 0) {
        resContainer.innerHTML = `<div class="p-3 text-xs text-slate-600 dark:text-slate-400 text-center font-medium">Santriwati tidak ditemukan.</div>`;
      } else {
        resContainer.innerHTML = matches.map(s => `
          <div onclick="selectStudentForInput('${s.id}')" class="p-3 hover:bg-sky-500/10 cursor-pointer flex justify-between items-center text-xs transition">
            <div>
              <span class="font-bold text-slate-900 dark:text-white">${s.name}</span>

              <div class="text-[10px] text-slate-600 dark:text-slate-400 mt-0.5 font-mono">${s.id}</div>
            </div>
            <span class="px-2 py-0.5 bg-sky-500/20 text-sky-600 dark:text-sky-400 border border-sky-500/30 font-bold rounded-full text-[10px]">Kelas ${s.class}</span>
          </div>
        `).join('');
      }
      resContainer.classList.remove('hidden');
    }

    function selectStudentForInput(id) {
      const s = (DB.students || []).find(item => item.id === id);
      if (!s) return;
      selectedStudentInput = s;
      document.getElementById('v-student-search').value = `${s.name} (${s.id})`;
      document.getElementById('v-student-class').value = `Kelas ${s.class}`;
      
      const prevCount = (DB.violations || []).filter(v => v.student_id === s.id && v.status !== 'DELETED').length;
      document.getElementById('v-student-history').value = `${prevCount} Pelanggaran Tercatat`;
      document.getElementById('student-search-results')?.classList.add('hidden');

      updateViolationLevelPreview();
    }

    function updateViolationLevelPreview() {
      const catId = document.getElementById('v-category')?.value;
      const box = document.getElementById('v-sanction-box');
      const text = document.getElementById('v-sanction-text');
      if (!catId || !selectedStudentInput) {
        box?.classList.add('hidden');
        return;
      }

      const cat = DB.categories.find(c => c.category_id === catId);
      if (!cat) return;

      const sameLevelCount = (DB.violations || []).filter(v => v.student_id === selectedStudentInput.id && v.level === cat.default_level && v.status !== 'DELETED').length;
      const currentCall = sameLevelCount + 1;
      const sanction = calculateSopSanction(cat.default_level, currentCall);

      box.classList.remove('hidden');
      text.innerText = `[${cat.default_level}] Panggilan ke-${currentCall} ➔ ${sanction}`;
    }

    function handleSaveViolation(e) {
      e.preventDefault();
      const toast = document.getElementById('violation-toast');

      if (!selectedStudentInput) {
        if (toast) {
          toast.className = 'p-4 rounded-2xl text-xs font-bold bg-rose-500/20 text-rose-500 border border-rose-500/30 block';
          toast.innerText = 'Pilih santriwati dari daftar autocomplete terlebih dahulu!';
        }
        return;
      }

      const catId = document.getElementById('v-category')?.value;
      const cat = DB.categories.find(c => c.category_id === catId);
      if (!cat) return;

      const sameLevelCount = (DB.violations || []).filter(v => v.student_id === selectedStudentInput.id && v.level === cat.default_level && v.status !== 'DELETED').length;
      const currentCall = sameLevelCount + 1;
      const sanction = calculateSopSanction(cat.default_level, currentCall);

      const record = {
        violation_id: 'VIO-' + Date.now(),
        date: document.getElementById('v-date')?.value || getTodayString(),
        session: document.getElementById('v-session')?.value || 'Ilqo Mufrodat',
        student_id: selectedStudentInput.id,
        student_name: selectedStudentInput.name,
        student_class: selectedStudentInput.class,
        category_id: cat.category_id,
        category_name: cat.category_name,
        level: cat.default_level,
        call_count: currentCall,
        sanction: sanction,
        description: document.getElementById('v-desc')?.value.trim() || '',
        officer: currentGlobalOfficer,
        status: 'BELUM_SELESAI',
        created_at: new Date().toISOString()
      };

      DB.violations.push(record);
      saveDB();

      alert(`Berhasil menyimpan catatan pelanggaran untuk ${selectedStudentInput.name}!`);
      navigate('violations');
    }

    function applyViolationFilters() {
      const tbody = document.getElementById('violations-table-body');
      if (!tbody) return;

      const q = (document.getElementById('vio-search')?.value || '').toLowerCase();
      const lvl = document.getElementById('vio-level-filter')?.value || 'ALL';
      const st = document.getElementById('vio-status-filter')?.value || 'ALL';

      let list = (DB.violations || []).filter(v => v.status !== 'DELETED').slice().reverse();

      if (q) {
        list = list.filter(v => v.student_name.toLowerCase().includes(q) || v.student_class.toLowerCase().includes(q));
      }
      if (lvl !== 'ALL') list = list.filter(v => v.level === lvl);
      if (st !== 'ALL') list = list.filter(v => v.status === st);

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="p-10 text-center text-slate-600 dark:text-slate-400 font-medium">Tidak ada catatan pelanggaran yang cocok.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map((v, idx) => `
        <tr class="hover:bg-sky-500/5 transition">
          <td class="p-4 text-center text-slate-600 dark:text-slate-400 font-bold">${idx + 1}</td>
          <td class="p-4 text-slate-600 dark:text-slate-400 font-mono">${v.date}</td>
          <td class="p-4 font-bold text-slate-900 dark:text-white">${v.student_name}</td>
          <td class="p-4 text-slate-700 dark:text-slate-300 font-semibold">${v.student_class}</td>
          <td class="p-4">
            <span class="font-bold block text-slate-900 dark:text-white">${v.category_name}</span>
            <span class="text-[9px] font-black px-1.5 py-0.5 rounded ${
              v.level === 'BERAT' ? 'bg-rose-500/20 text-rose-500' :
              v.level === 'SEDANG' ? 'bg-orange-500/20 text-orange-500' : 'bg-amber-500/20 text-amber-500'
            }">${v.level} • Panggilan ${v.call_count}</span>
          </td>
          <td class="p-4 text-[11px] text-sky-600 dark:text-sky-400 font-semibold">${v.sanction}</td>
          <td class="p-4 text-center">
            <button onclick="toggleSanctionStatus('${v.violation_id}')" class="px-2.5 py-1 rounded-full text-[10px] font-bold ${
              v.status === 'SUDAH_SETOR' ? 'bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30' : 'bg-rose-500/20 text-rose-500 border border-rose-500/30'
            }">
              ${v.status === 'SUDAH_SETOR' ? '✓ Sudah Setor' : '⚠ Belum Selesai'}
            </button>
          </td>
          <td class="p-4 text-center">
            <button onclick="deleteViolationRecord('${v.violation_id}')" class="p-1 hover:bg-rose-500/10 text-slate-600 dark:text-slate-400 hover:text-rose-500 rounded-lg transition">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </td>
        </tr>
      `).join('');

      safeCreateIcons();
    }

    function toggleSanctionStatus(id) {
      const v = (DB.violations || []).find(item => item.violation_id === id);
      if (!v) return;
      v.status = v.status === 'SUDAH_SETOR' ? 'BELUM_SELESAI' : 'SUDAH_SETOR';
      saveDB();
      applyViolationFilters();
    }

    function deleteViolationRecord(id) {
      if (confirm('Hapus catatan pelanggaran ini?')) {
        DB.violations = (DB.violations || []).filter(v => v.violation_id !== id);
        saveDB();
        applyViolationFilters();
      }
    }

              <h3 class="text-xs font-black uppercase tracking-wider text-slate-700 dark:text-slate-300">Rekap Berdasarkan Kategori</h3>
              <div class="space-y-4">
                ${DB.categories.map(c => {
                  const cnt = catCounts[c.category_name] || 0;
                  const pct = allV.length > 0 ? Math.round((cnt / allV.length) * 100) : 0;

    function exportToCsv() {
      const allV = (DB.violations || []).filter(v => v.status !== 'DELETED');
      if (allV.length === 0) {
        alert("Belum ada data pelanggaran untuk diekspor!");
        return;
      }

      let csv = "ID,Tanggal,Nama Santriwati,Kelas,Sesi,Pelanggaran,Tingkatan,Sanksi,Status,Petugas\n";
      allV.forEach(v => {
        csv += `"${v.violation_id}","${v.date}","${v.student_name}","${v.student_class}","${v.session}","${v.category_name}","${v.level}","${v.sanction}","${v.status}","${v.officer}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `Rekap_LPJ_Bahasa_ZIIS_${getTodayString()}.csv`;
      link.click();
    }

    // ==========================================
    // 8. MIGRASI DATA / BACKUP JSON
    // ==========================================
    function renderBackup(container) {
      const activeJson = JSON.stringify({
        violations: DB.violations,
        permissions: DB.permissions,
        letters: DB.letters,
        categories: DB.categories,

        timestamp: new Date().toISOString()

            <textarea id="json-export-area" readonly class="w-full h-44 cli-inner border rounded-2xl p-3 font-mono text-[11px] focus:outline-none custom-scroll font-medium text-slate-900 dark:text-white">${activeJson}</textarea>

              <i data-lucide="copy" class="w-4 h-4"></i>
              <span>Copy Kode JSON</span>
            </button>
          </div>

          <div class="cli-card rounded-3xl border shadow-xs p-6 space-y-3">
            <div class="flex items-center gap-2">
              <span class="text-base font-extrabold text-slate-900 dark:text-white">📥 Import / Paste Data</span>
            </div>
            <p class="text-xs text-slate-600 dark:text-slate-400">Paste kode JSON dari backup device lain ke kolom ini, lalu klik tombol **Import Data**.</p>
            
            <textarea id="json-import-area" placeholder="Paste kode JSON di sini..." class="w-full h-44 cli-inner border rounded-2xl p-3 font-mono text-[11px] focus:outline-none focus:border-sky-500 custom-scroll font-medium text-slate-900 dark:text-white"></textarea>
            
            <div class="flex items-center gap-3">
              <button onclick="executeJsonImport('merge')" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl text-xs shadow-md flex items-center gap-2 transition">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>Import Data (Gabungkan)</span>
              </button>
              <button onclick="executeJsonImport('replace')" class="px-5 py-2.5 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl text-xs shadow-md flex items-center gap-2 transition">
                <i data-lucide="refresh-ccw" class="w-4 h-4"></i>
                <span>Timpa Semua Data Lama</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    async function copyJsonBackup() {
      const area = document.getElementById('json-export-area');
      if (!area) return;
      area.select();
      try {
        await navigator.clipboard.writeText(area.value);
        alert('Kode JSON berhasil disalin ke clipboard!');
      } catch (e) {
        alert('Gagal menyalin otomatis, silakan blok dan salin manual.');
      }
    }

    function executeJsonImport(mode) {
      const raw = document.getElementById('json-import-area')?.value.trim();
      if (!raw) {
        alert('Kolom JSON import masih kosong!');
        return;
      }
      try {
        const parsed = JSON.parse(raw);
        if (mode === 'replace') {
          DB.violations = parsed.violations || [];
          DB.permissions = parsed.permissions || [];
          DB.letters = parsed.letters || [];
          if (parsed.categories) DB.categories = parsed.categories;
          if (parsed.students) DB.students = parsed.students;
        } else {
          DB.violations = [...DB.violations, ...(parsed.violations || [])];
          DB.permissions = [...DB.permissions, ...(parsed.permissions || [])];
          DB.letters = [...DB.letters, ...(parsed.letters || [])];
          if (parsed.students) DB.students = [...DB.students, ...(parsed.students || [])];
        }
        saveDB();
        alert('Data JSON berhasil di-import dan diperbarui!');
        navigate('dashboard');
      } catch (err) {
        alert('Format kode JSON tidak valid! Pastikan format sesuai.');
      }
    }

    function handleGlobalHeaderSearch(q) {
      const res = document.getElementById('header-search-results');
      if (!res) return;
      if (!q || q.length < 2) {
        res.classList.add('hidden');
        return;
      }
      const matches = (DB.students || []).filter(s => 
        s.name.toLowerCase().includes(q.toLowerCase()) || 
        s.class.toLowerCase().includes(q.toLowerCase()) ||
        s.id.toLowerCase().includes(q.toLowerCase())
      ).slice(0, 6);

      if (matches.length === 0) {
        res.innerHTML = `<div class="p-3 text-xs text-slate-600 dark:text-slate-400 text-center font-medium">Tidak ditemukan.</div>`;
      } else {
        res.innerHTML = matches.map(s => `
          <div onclick="navigate('students'); document.getElementById('header-search-results')?.classList.add('hidden');" class="p-2.5 hover:bg-sky-500/10 rounded-xl cursor-pointer flex justify-between items-center text-xs transition">

              <span class="font-bold text-slate-900 dark:text-white">${s.name}</span>
              ${s.is_lcd ? '<span class="ml-1 text-[9px] bg-pink-500/20 text-pink-500 px-1 py-0.5 rounded font-black">LCD</span>' : ''}

            </div>
            <span class="px-2 py-0.5 bg-sky-500/20 text-sky-600 dark:text-sky-400 font-bold rounded-full text-[10px]">Kelas ${s.class}</span>
          </div>
        `).join('');
      }
      res.classList.remove('hidden');
    }

    window.addEventListener('keydown', (e) => {

        e.preventDefault();
        document.getElementById('global-search-header')?.focus();
      }
    });
